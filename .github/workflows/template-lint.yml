name: Lint template

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate template and icon
        run: scripts/validate-template.py '${{ github.repository }}'
      - name: Shell scripts
        run: shellcheck scripts/*.sh
