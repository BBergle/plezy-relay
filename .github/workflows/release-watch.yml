name: Watch for Plezy releases

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      release:
        description: 'Specific upstream release to publish (default: newest)'
        required: false
        type: string
      force_rebuild:
        description: 'Rebuild even if already published or server/ is unchanged'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-watch
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/plezy-relay

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.plan.outputs.action }}
      release: ${{ steps.plan.outputs.release }}
      sha: ${{ steps.plan.outputs.sha }}
      tree: ${{ steps.plan.outputs.tree }}
      source: ${{ steps.plan.outputs.source }}
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: scripts/plan-release.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ghcr.io requires a lowercase path; repository_owner preserves case.
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/plezy-relay
          FORCE_RELEASE: ${{ inputs.release }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}

  build:
    needs: plan
    if: needs.plan.outputs.action == 'build'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.plan.outputs.release }}
      tags: ${{ needs.plan.outputs.tags }}
    permissions:
      contents: read
      packages: write

  retag:
    needs: plan
    if: needs.plan.outputs.action == 'retag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point new tags at the existing manifest
        run: |
          set -euo pipefail
          # server/ is byte-identical to ${{ needs.plan.outputs.source }}, so reuse
          # that manifest rather than producing a new digest for the same source.
          args=()
          while read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<< "${{ needs.plan.outputs.tags }}"
          docker buildx imagetools create "${args[@]}" \
            "${IMAGE_NAME}:${{ needs.plan.outputs.source }}"

  record:
    needs: [plan, build, retag]
    if: always() && needs.plan.outputs.action != 'none' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Record the published release and refresh the template
        run: |
          set -euo pipefail
          jq --arg r '${{ needs.plan.outputs.release }}' \
             --arg t '${{ needs.plan.outputs.tree }}' \
             '.processed = ((.processed + [$r]) | unique)
              | .trees[$t] = (.trees[$t] // $r)' \
             state/builds.json > state/builds.json.tmp
          mv state/builds.json.tmp state/builds.json
          scripts/render-template.sh
          scripts/validate-template.py '${{ github.repository }}'

      - name: Commit
        run: |
          set -euo pipefail
          if git diff --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/builds.json unraid/plezy-relay.xml
          git commit -m 'Publish relay ${{ needs.plan.outputs.release }}'
          git push

      - name: Mirror template to unraid-templates
        # Cross-repo push needs a PAT. The `secrets` context is not allowed in a
        # step `if`, so the token is surfaced through env and tested there.
        env:
          GH_TOKEN: ${{ secrets.TEMPLATES_REPO_TOKEN }}
          RELEASE: ${{ needs.plan.outputs.release }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "TEMPLATES_REPO_TOKEN not set - skipping mirror"; exit 0
          fi
          scripts/mirror-template.sh
